[project]
name = "pilgrim-radio"
version = "0.2.0"
description = "Pilgrim Dot Farm — AI-generated radio station"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "soundfile>=0.12",
    "numpy>=1.26",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["pilgrim/tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
exclude = ["old_style"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["old_style"]
src = ["pilgrim"]

[tool.ruff.lint]
# Pragmatic modern profile: errors, pyflakes, import sorting, pyupgrade,
# bugbear, and simplify. Pylint-family (PL) and builtin-shadowing (A) are a
# poor fit for this defensive dispatch style and are deliberately excluded.
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"pilgrim/tests/*" = ["BLE001"]
"pilgrim/*.py" = []

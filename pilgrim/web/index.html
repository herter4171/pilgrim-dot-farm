<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PILGRIM DOT FARM — radio</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="rain"></canvas>
<header id="titlebar">
  <div class="logo">📻&nbsp; P I L G R I M <span>DOT FARM</span></div>
  <div class="tagline">24/7 AI radio from the town of Thistledown</div>
</header>

<main id="desktop">
  <section class="window" data-win="radio">
    <div class="win-bar">
      <span class="win-title">◉ ON AIR — Pilgrim Dot Farm</span>
    </div>
    <div class="win-body">
      <div id="indicator" class="indicator idle">
        <span class="dot"></span>
        <span id="ind-label">idle</span>
      </div>
      <button id="btn-play" class="big-btn">▶&nbsp; PLAY</button>
      <canvas id="level" width="320" height="40"></canvas>
      <div id="offair" class="offair hidden">⚠ OFF THE AIR — waiting for playable audio. Retrying…</div>
      <div id="status" class="status"></div>
    </div>
  </section>

  <section class="window requests" data-win="requests">
    <div class="win-bar">
      <span class="win-title">✉ REQUEST LINE</span>
    </div>
    <div class="win-body requests">
      <p class="req-note">Leave a line for the DJ. Top ten go on air.<br>
        Clean-ish: adult nuance is fine, no explicit / crass / hate / illegal.</p>
      <div class="req-form">
        <input id="req-input" type="text" maxlength="160" autocomplete="off"
               placeholder="Request a tune or leave a line for Liam…">
        <button id="req-send">Send</button>
      </div>
      <div id="req-err" class="req-err hidden"></div>
      <div class="req-list-head">NOW QUEUED</div>
      <ol id="req-queue" class="req-queue"></ol>
    </div>
  </section>
</main>

<script src="requests.js"></script>
<script src="player.js"></script>
</body>
</html>

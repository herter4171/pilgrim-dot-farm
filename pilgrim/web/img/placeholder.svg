    </pattern>
  </defs>
  <rect width="300" height="300" fill="url(#grain)"/>
  <rect x="10" y="10" width="280" height="280" fill="none" stroke="#a63dff" stroke-width="2"/>
  <rect x="18" y="18" width="264" height="264" fill="none" stroke="#ff3d9a" stroke-width="1" stroke-dasharray="6 4"/>

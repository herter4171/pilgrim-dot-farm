# Pilgrim Dot Farm Radio — configuration (RADIO.md §12)
# Hosts, models, voices, targets all come from here. No hardcoded addresses.

station:
  name: "Pilgrim Dot Farm"
  port: 5080               # PUBLIC listener: edge-facing routes only (5000 is macOS AirPlay Receiver)
  host: "127.0.0.1"        # loopback only on the M5 origin (RUNBOOK §2); the gateway fronts it
  admin_port: 5081         # ADMIN listener: full API incl. /api/admin/*
  admin_host: "127.0.0.1"  # loopback only by default; never expose this
  serve_web: false         # edges serve pilgrim/web/ (split); true only for a single-host run
  rng_seed: null           # set for deterministic tests/sim
  timezone: America/Detroit  # DJ clock time (OVERHAUL 5.3)

hosts:
  # song generators are the pool in songs.gen_backends (RADIO §6.2)
  kokoro: http://192.168.68.89:8001
  litellm: https://litellm.twr.church/v1
  # searxng is reached through the LiteLLM MCP server (web_search-searxng tool),
  # NOT a direct HTTP /search. This is the MCP Streamable-HTTP endpoint.
  searxng: https://litellm.twr.church/mcp
  sfx: http://192.168.68.88:8000   # MOSS-SoundEffect v2.0 (docs/backends.md §7)

models:
  news: qwen38
  briefs: qwen38
  dj_talk: qwen38
  commercials: "Ornith-1.5-9B"
  liners: "Ornith-1.5-9B"
  field_report: qwen38
  music: MiniMax-Music-3   # LiteLLM model group for songs.gen_backends with auth: litellm
  # Context window per model. Calls send max_tokens = context - prompt estimate
  # (no artificial output limit); omitting max_tokens hits qwen38's server
  # default of 8192, which cut long song briefs off empty (2026-11-01).
  context_tokens:
    qwen38: 262144
  # Largest max_tokens the server admits alongside other calls (it reserves the
  # whole amount up front; 260k expired waiting for admission, 32k got in).
  # 4x the 8192 default that cut long briefs off.
  output_tokens:
    qwen38: 32768

voices:
  dj: am_liam
  news: am_michael
  commercials: af_aoede
  liners: am_liam
  field_reporter: bm_lewis   # British field reporter (SFX.md §4.2, user pick)
  speed: 1.0             # seconds-per-word calibrated at setup; 1.0 is Koken default

playout:
  committed_lookahead_s: 300     # keep >= this much committed audio ahead (5 min: requests air sooner)
  filler_horizon_s: 60           # repeat a liner/spot inside its spacing only below this coverage
  request_hold_max_s: 0          # 0 = no hold: songs keep airing while a request is written/generated; a ready request splices into the next song slot. >0 = hold the window (talk only) up to this long per request
  window_trim_keep_s: 120        # keep this much committed history behind "now"
  weights: {song: 0.55, dj_talk: 0.12, commercial_break: 0.15, liner: 0.10, news: 0.08,
            field_report: 0.05, promo: 0.05, time_check: 0.04}
  max_consecutive_non_song: 2
  top_of_hour_window_s: 240      # a song gap this close to :00 leads with a callout (soft)
  news_min_spacing_s: 1200
  news_ttl_s: 2700
  commercial_min_spacing_s: 1800
  song_min_spacing_s: [3600, 1800, 900]   # hard floor 1h per operator; relax stepwise
  genre_no_repeat: 3
  # Recycled-song weighting (PRIORITIES §3, RADIO §5.2 Tier 2):
  #   weight = youth * (wait_floor + (1 - wait_floor) * wait)
  # youth halves every half_life_h hours (floored at youth_floor); wait grows
  # 0..1 while unheard, saturating at wait_target_h. Young/recent songs lean up;
  # no song starves (old songs thin out, they don't disappear).
  song_rotation:
    half_life_h: 12        # a song's youth boost halves every 12 h (Q2: 6 or 24?)
    youth_floor: 0.1       # old songs keep >=10% of a new song's pull
    wait_target_h: 3       # after 3 h unheard a song's wait factor maxes out
    wait_floor: 0.2        # a song just past spacing still has some chance

inventory:
  fresh_songs_ready: 2
  briefs_queued: 3
  commercials_min: 20            # RADIO.md §6.1/§12: >= 20 so a song drought has spots to air
  liners_per_bucket: 4
  liner_buckets_s: [3, 5, 10, 15, 30]
  dj_talk_min: 2
  field_reports_min: 1
  station_ids_min: 3             # emergency station IDs (RADIO §8.3), never deleted

songs:
  # duration_seconds sent to the generator is max_duration_s; the model may end sooner.
  min_duration_s: 20    # sanity floor for songs (OVERHAUL 3.2)
  max_duration_s: 360   # sent as duration_seconds (1-360); also the song QC ceiling
  abrupt_fade_s: 2.5    # fade-out for songs with hard endings (OVERHAUL 3.2)
  stock_gap_s: 600      # wait between stock song generations; listener requests skip it (§6.1)
  stock_max_library: 100  # pause stock generation once the library has this many songs; requests still produce
  # Song generator pool (RADIO §6.2). Through LiteLLM's vLLM pass-through the
  # router fans renders out over the three MiniMax Music 3 deployments
  # (two audiocpp GPU boxes + the M5 MLX box, docs/backends.md §2b), so one
  # entry with 3 slots. Direct mode = one entry per box with slots: 1.
  gen_backends:
    # 2026-11-01 03:21-03:28 the LiteLLM /vllm pass-through answered 500 to
    # every render; it was back by 13:19 (10 s probe: 200, audiocpp). If it
    # fails again, fall back to the direct M5 tunnel (1 slot):
    #   - {name: m5, url: "http://127.0.0.1:11234", rtf_hint: 0.6}
    - {name: litellm, slots: 3, auth: litellm}   # url derived: hosts.litellm minus /v1, plus /vllm
  free_request_slots: 2   # free requests rendering at once; the last slot always stays open for a paid one
  submit_stagger_s: 5     # min seconds between render submissions: LiteLLM only fans them out across the boxes with a delay
  backend_cooldown_s: 120 # unreachable generator sits out this long (doubling to 600 s)
  genres:
    # MiniMax Music 3 style families (prompting guide §5). Ids must exist in
    # pilgrim/genres.py; values are selection weights. Genre is family-level:
    # the caption names the specific style/subgenre inside the family.
    country-americana: 3
    jazz-swing-big-band: 3
    contemporary-folk-acoustic: 2
    roots-traditional-global: 2
    soul-blues-gospel: 2
    dance-pop-disco-funk: 2
    general-pop-ballad: 2
    pop-alternative-rock: 2
    traditional-vocal-stage: 2
    electronic-synth-ambient-pop: 1
    hip-hop-rap: 1
    modern-rnb-neo-soul: 1
    club-edm-house-trance: 1
    metal-heavy-rock: 1
    cinematic-pop-ballad: 1
    cinematic-orchestral-epic: 1
    east-asian-modern: 1
    east-asian-ballad-heritage: 1

news:
  enabled: true
  refresh_s: 1800
  max_searches: 3
  budget_s: 60

# Listener request line. FIFO top-N with LLM moderation: clean/playful requests ok,
# adult *allusion* ok, but explicit/crass/hate/illegal are rejected by the moderator.
requests:
  queue_cap: 50          # request-board display size (public line never evicts)
  free_queue_max: 100    # free requests waiting (queued/producing/ready); new ones refused beyond. Paid never capped
  max_length: 160        # chars allowed per request
  moderation_model: qwen38  # stricter reasoning model for the gate
  moderation_max_tokens: null  # no output cap; reasoning counts against it (docs/backends.md §1)
  per_client_per_10min: 3   # request-line rate limit (OVERHAUL 4.3)

# Persistent unique-visitor counter (COSMETIC_PATCHING §6, RADIO §14).
# Stores the raw canonical client IP (deduped); count starts at 0.
visitors:
  enabled: true
  # Peers whose X-Real-IP / first X-Forwarded-For we trust as the real client.
  # Verified deployment: nginx on loopback sets X-Real-IP to $remote_addr.
  trusted_proxies: [127.0.0.1, "::1"]
  listener_timeout_s: 15   # live listener drops after this long without a heartbeat
  max_listeners: 1000      # cap on tracked player IDs (player_id is client-supplied)

audio:
  lufs: -16.0
  true_peak_db: -1.0
  lra: 7.0
  edge_pad_ms: 150
  tts_join_gap_ms: 250   # pause inserted between trimmed Kokoro chunks
  delivery: mp3          # RADIO §8.2: 48 kHz stereo CBR MP3 with a gapless (LAME/Info) header
  sample_rate: 48000     # MPEG-1 rate: WebKit ignores gapless info on 24 kHz (MPEG-2) MP3s
  mp3_kbps: 192          # stereo sources (songs)
  mp3_mono_source_kbps: 96   # mono sources (speech, SFX); delivered as stereo (WebKit, mono)
  silence_db: -50
  max_words_per_s: 4.2   # speech-rate QC ceiling (truncation smell); legit Kokoro reads hit 3.6-4.0
  min_words_per_s: 1.2   # speech-rate QC floor

logging:
  level: INFO
  dir: logs              # relative to pilgrim/
  file: station.log
  max_bytes: 10485760    # 10 MB
  backups: 5

media:                       # RADIO §8.4: S3 + CloudFront is the media source of truth
  publish: true              # uploader task in the station process
  bucket: pilgrim-dot-farm-public
  region: us-west-1
  aws_profile: mac-studio    # IAM user with bucket-scoped keys (not the expiring `aws login` default)
  key_prefix: audio/
  public_base_url: https://d7gwl8cmdyh0k.cloudfront.net
  poll_s: 5
  concurrency: 4
  timeout_s: 120
  max_attempts: 5

library:
  soft_cap_gb: 100
  dir: library
  web_dir: web
  db: station.db
  bible_dir: bible
  prompts_dir: prompts

dj:                          # DJ console (TUI.md §7, RADIO §12)
  enabled: true              # operator character + phrases armed
  state_poll_s: 1.0          # cheap state poll interval (console)
  backoff_max_s: 10          # reconnect backoff ceiling on disconnects
  request_timeout_s: 5
  cutover_deadline_s: 2.0    # acknowledged-skip budget for healthy clients (§5.5)
  cutover_lead_s: 1.0        # client-notification lead before cutover activation
  cutover_fade_s: 0.02       # anti-click fade at the cutover boundary (§9.2)
  queue_max: 20
  phrase_max_chars: 280
  phrase_prefix: "This is the administrator,"   # prepended unless already spoken (§4)
  phrase_ttl_s: 7200         # unqueued ready phrase lifetime
  job_timeout_s: 300
  character:
    id: dj_operator          # stable ID; name + voice chosen by the operator by ear (§10)
    name: Jimmany            # operator-named DJ character
    voice: am_justin         # reserved unused Kokoro voice (operator pick, by ear)
    speed: 1.0

talk:
  time_mention_ttl_s: 900   # DJ clips that mention the time expire after this
  time_check_marks_min: [0, 15, 30, 45]   # top, quarter past, bottom, quarter til
  time_check_window_s: 120                 # a check airs only this close to its mark
  time_check_min_gap_s: 600
  hosts:
    - id: liam
      name: Liam
      voice: am_liam
      persona: warm and wry, a little absurd; loves the town, the barn and the weather
      day_parts: [overnight, morning drive]
    # PROVISIONAL (operator picked "American, woman" but not the id by ear —
    # AGENTS §9). Samples in voice-samples/af_bella|af_nicole|af_sarah|af_river.wav.
    - id: mara
      name: Mara
      voice: af_bella
      persona: dry and quick, a little conspiratorial; treats Thistledown like a beat she covers
      day_parts: [midday, afternoon, evening]
  field_reporter_name: Giles  # PLACEHOLDER until the user names him (SFX.md §10.1)

# Sound effects overlaid on non-news talk (SFX.md). Never on news, by construction.
sfx:
  enabled: true
  model: moss-soundeffect-v2.0
  steps: 100               # flow-match solver steps (server default)
  cfg_scale: 4.0
  sigma_shift: 5.0         # flow-match scheduler shift (server default)
  negative_prompt: ""      # CFG negative prompt
  timeout_s: 180           # ~38 s wall per 2 s clip at 100 steps
  stinger_gain: 0.5        # TBD by ear (SFX.md §10.3); applied at air time
  bed_gain: 0.15
  host_duck: 0.7           # host gain while a stinger plays (anti-clip)
  bed_cue: wind_bed        # ambience under every field report
  bed_max_s: 30
  joke_cue: rimshot        # 50/50 coin after a marked joke
  joke_p: 0.5
  max_per_window: 3        # at most 3 stingers ...
  window_s: 10             # ... in any 10 s of air
  max_stinger_s: 2.5
  # Palette for MOSS-SoundEffect v2.0 (2026-10-01): all approved unheard at the
  # operator's call; flip `approved: false` on any cue that sounds wrong by ear.
  # evergreen: rendered once into a recycled stock pool (fixed seed).
  # otherwise contextual: rendered fresh for the clip that calls for it.
  # Stingers longer than max_stinger_s never air, so keep them <= 2.5 s.
  cues:
    # -- barnyard animals (contextual: a fresh take each time) --
    chicken: {prompt: "an excited chicken clucking rapidly, a quick burst of rhythmic clucks with one squawk, dry and crisp, close-miked barnyard recording", duration_s: 2.0}
    cow: {prompt: "a single deep cartoon cow moo, slow sustained low moan with a soft vibrato tail, warm low-mid body, dry close-miked barn recording", duration_s: 2.0}
    horse: {prompt: "a cartoon horse neighing once followed by a snort, rising whinny that warbles then a short snort, dry close recording", duration_s: 2.0}
    pig: {prompt: "a happy pig oinking three short times, comic grunty squeal, nasal bright bursts that cut off quickly, close-miked barnyard recording", duration_s: 2.0}
    rooster: {prompt: "a rooster crowing cock-a-doodle-doo, three rising syllables with a clear piercing held cry at the end, bright nasal tone, recorded outdoors in the morning", duration_s: 2.5}
    sheep: {prompt: "a sheep baaing once, a drawn-out nasal bleat that wobbles up then drops, woolly low-mid tone, natural field recording, close mic", duration_s: 2.0}
    goat: {prompt: "a goat bleating a short frantic maa twice, quick nasal bleat, dry and crisp, close-miked barn recording", duration_s: 2.0}
    duck: {prompt: "a duck quacking a short series of comedic quacks, raspy nasal honk-like bursts, dry close-miked pondside recording", duration_s: 2.0}
    turkey: {prompt: "a turkey gobbling loud bubbly gobbles, rapid low bubbling glottal bursts that pitch upward, comedic and nasal, close barnyard recording", duration_s: 2.0}
    donkey: {prompt: "a donkey braying loudly once, harsh hee-haw that starts low and ends in a high wobbly cry, dry outdoor recording", duration_s: 2.5}
    # -- field / farm props --
    wind_bed: {prompt: "gentle wind blowing over an open grassy field, continuous soft outdoor ambience with slow undulating volume, a few distant rustles, wide field recording", duration_s: 10.0}
    sprinkler: {prompt: "a garden irrigation sprinkler spraying water, rhythmic psst psst bursts as the head rotates, gentle water hiss between bursts, close outdoor recording", duration_s: 2.0, seed: 301, evergreen: true}
    tractor: {prompt: "an old diesel tractor engine starting, brief starter motor whine then chugging coughs into a rough idle, deep low-frequency rumble, close exterior recording", duration_s: 2.5, seed: 311, evergreen: true}
    hay_bale: {prompt: "a heavy hay bale dropped onto the ground, one soft dense muffled thud and a few straw rustles settling, close field recording", duration_s: 1.5, seed: 321, evergreen: true}
    barn_door: {prompt: "a heavy wooden barn door slamming shut, hard impact with a short rattle of the latch, resonant low-mid boom, dry wooden body", duration_s: 2.0, seed: 331, evergreen: true}
    gate_creak: {prompt: "a wooden farm gate swinging open slowly, a prolonged creaking hinge squeak then a soft thud as it stops, resonant wood, close-miked", duration_s: 2.5, seed: 341, evergreen: true}
    cowbell: {prompt: "a metal cowbell clanking a few times, bright metallic ringing hits with a short tinny decay, close-miked", duration_s: 2.0, seed: 351, evergreen: true}
    # -- silly-DJ stock (evergreen) --
    rimshot: {prompt: "a comedy rimshot ba-dum-tss, two quick snare drum hits followed by a short cymbal crash, dry and crisp, close drum recording", duration_s: 1.5, seed: 101, evergreen: true}
    airhorn: {prompt: "a comedic party airhorn blast, one long harsh buzzy honk that wobbles slightly downward, bright and loud, close recording", duration_s: 1.5, seed: 111, evergreen: true}
    record_scratch: {prompt: "a DJ turntable record scratch, two sharp vinyl back-and-forth sweeps, bright crackly friction, close pickup", duration_s: 1.5, seed: 121, evergreen: true}
    sad_trombone: {prompt: "a sad trombone wah-wah-wah-wah, four descending comedic trombone notes with a sleepy brassy tone, dry close studio recording", duration_s: 2.5, seed: 131, evergreen: true}
    boing: {prompt: "a cartoon spring boing, a single fast bouncing metallic spring that wiggles up and down then slows to a stop, bright resonant tone, dry recording", duration_s: 1.5, seed: 141, evergreen: true}
    applause: {prompt: "a short burst of small tinny crowd applause, many rapid handclaps with light room tone, slightly distant recording", duration_s: 2.0, seed: 151, evergreen: true}
    slide_whistle: {prompt: "a cartoon slide whistle sliding up then down, smooth gliding pitch rise then fall, bright whirly tone, dry studio recording", duration_s: 2.0, seed: 24, evergreen: true}
    cymbal_crash: {prompt: "a single bright cymbal crash, sharp metallic attack with a shimmering ring-out decay, close-miked drum kit", duration_s: 1.5, seed: 161, evergreen: true}
    drum_roll: {prompt: "a comedic drum roll that builds then lands on a final cymbal and bass hit, rapid snare crescendo then a big crash, dry close drum recording", duration_s: 2.5, seed: 171, evergreen: true}
    harp_gliss: {prompt: "a magical harp glissando, a quick upward sweep of plucked strings ending in a bright shimmer, delicate airy tone, close studio recording", duration_s: 2.0, seed: 181, evergreen: true}
    kazoo: {prompt: "a kazoo playing a short comedic ta-daa tune, buzzy nasal plastic-reed sound, dry close studio recording", duration_s: 1.5, seed: 191, evergreen: true}

# Paid priority requests (PAYMENT.md §2.1). Default off: also inactive when any
# of STRIPE_SECRET_KEY / STRIPE_PUBLISHABLE_KEY / STRIPE_WEBHOOK_SECRET is unset.
payments:
  enabled: true            # live deployment (PAYMENT.md Step 12)
  api_base: https://api.stripe.com
  api_version: "2026-10-28.endive"
  price_id_live: price_1UWQHdKOiB5HDXLd4qNMoosI
  price_id_test: ""            # test-mode price, filled in from Step 0.3
  currency: usd
  min_cents: 300               # defence in depth; Stripe enforces it too
  max_cents: 6769
  timeout_s: 10                # every Stripe HTTP call
  retries: 2                   # create/retrieve only; backoff 0.5 s, 1 s
  checkout_expiry_s: 1800      # Stripe minimum is 30 min
  webhook_tolerance_s: 300     # max age of a signed webhook timestamp
  reconcile_after_s: 10        # status poll may ask Stripe after this long
  reconcile_min_interval_s: 5  # at most one retrieve per row per interval
  abandon_after_s: 259200      # 72 h: awaiting_payment rows older than this -> abandoned
  paid_max_length: 6000       # a full MiniMax caption + lyric sheet (PAYMENT.md Step 12c)
  paid_max_lines: 200
  per_client_per_10min: 6      # rate limit on POST /api/paid-requests
  max_attempts: 5              # production attempts before `failed`
  managed_payments: false      # send managed_payments[enabled]=false (tax code ineligible)
  copyright:                   # web screen for copied lyrics (PAYMENT.md Step 12b)
    enabled: true
    engines: startpage         # bing truncates queries; others rate-limit us
    max_probes: 4              # lyric lines searched per paid request
    min_words: 6
    min_content_words: 3
    ngram: 6                   # consecutive matching words = a hit
    results: 5
    timeout_s: 20

promotions:
  request_line_gap_s: 2700     # one request-line plug per 45 min
  promo_min_spacing_s: 600     # no two promos closer than this
  campaigns:
    - id: thanksgiving-2026
      label: Thanksgiving      # must appear verbatim in every promo
      date: "2026-11-26"       # station-local (America/Detroit)
      cta: the request line
      light_touch: true        # timing is optional; most promos just name the day
      lines:
        - a song for the table
        - the great Thistledown turkey census
        - what we are thankful for
        - the request line is open for Thanksgiving
      schedule:
        - {from: "2026-11-05", until: "2026-11-18", per_hour: 1}
        - {from: "2026-11-19", until: "2026-11-25", per_hour: 2}
        - {from: "2026-11-26", until: "2026-11-26", per_hour: 3, after_news: true}

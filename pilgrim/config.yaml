# Pilgrim Dot Farm Radio — configuration (RADIO.md §12)
# Hosts, models, voices, targets all come from here. No hardcoded addresses.

station:
  name: "Pilgrim Dot Farm"
  port: 5000
  rng_seed: null          # set for deterministic tests/sim
  host: "0.0.0.0"
  timezone: America/Detroit  # DJ clock time (OVERHAUL 5.3)

hosts:
  mlx_serve: http://127.0.0.1:11234
  kokoro: http://localhost:8001
  litellm: http://localhost:4000/v1
  # searxng is reached through the LiteLLM MCP server (web_search-searxng tool),
  # NOT a direct HTTP /search. This is the MCP Streamable-HTTP endpoint.
  searxng: http://localhost:4000/mcp
  sfx: http://127.0.0.1:8500   # Stable Audio 3 Small SFX (SFX.md §1)

models:
  news: qwen38
  briefs: qwen38
  dj_talk: qwen38
  commercials: "Ornith-1.5-9B"
  liners: "Ornith-1.5-9B"
  field_report: qwen38

voices:
  dj: am_liam
  news: am_michael
  commercials: af_aoede
  liners: am_liam
  field_reporter: bm_lewis   # British field reporter (SFX.md §4.2, user pick)
  speed: 1.0             # seconds-per-word calibrated at setup; 1.0 is Koken default

playout:
  committed_lookahead_s: 600     # keep >= this much committed audio ahead
  filler_horizon_s: 60           # repeat a liner/spot inside its spacing only below this coverage
  window_trim_keep_s: 120        # keep this much committed history behind "now"
  weights: {song: 0.55, dj_talk: 0.12, commercial_break: 0.15, liner: 0.10, news: 0.08,
            field_report: 0.05}
  max_consecutive_non_song: 2
  news_min_spacing_s: 1200
  news_ttl_s: 2700
  commercial_min_spacing_s: 1800
  song_min_spacing_s: [3600, 1800, 900]   # hard floor 1h per operator; relax stepwise
  genre_no_repeat: 3

inventory:
  fresh_songs_ready: 2
  briefs_queued: 3
  commercials_min: 20            # RADIO.md §6.1/§12: >= 20 so a song drought has spots to air
  liners_per_bucket: 3
  liner_buckets_s: [3, 5, 10, 15, 30]
  dj_talk_min: 2
  field_reports_min: 1

songs:
  # duration_seconds sent to mlx-serve is max_duration_s; the model may end sooner.
  min_duration_s: 20    # sanity floor for songs (OVERHAUL 3.2)
  max_duration_s: 360   # sent as duration_seconds (1-360); also the song QC ceiling
  abrupt_fade_s: 2.5    # fade-out for songs with hard endings (OVERHAUL 3.2)
  genres:
    synthwave: 1
    bluegrass: 1
    doom metal: 1
    bossa nova: 1
    polka: 1
    yacht rock: 1
    dungeon synth: 1
    chiptune: 1

news:
  enabled: true
  refresh_s: 1800
  max_searches: 3
  budget_s: 60

# Listener request line. FIFO top-N with LLM moderation: clean/playful requests ok,
# adult *allusion* ok, but explicit/crass/hate/illegal are rejected by the moderator.
requests:
  queue_cap: 10          # live queue size; the (cap+1)th oldest falls out
  max_length: 160        # chars allowed per request
  moderation_model: qwen38  # stricter reasoning model for the gate
  moderation_max_tokens: 4096  # cap for the moderation call (OVERHAUL 4.2)
  per_client_per_10min: 3   # request-line rate limit (OVERHAUL 4.3)

# Persistent unique-visitor counter (COSMETIC_PATCHING §6, RADIO §14).
# Raw IPs are never stored; only an HMAC-SHA256 signature under secret_env.
visitors:
  enabled: true
  # Peers whose X-Real-IP / first X-Forwarded-For we trust as the real client.
  # Verified deployment: nginx on loopback sets X-Real-IP to $remote_addr.
  trusted_proxies: [127.0.0.1, "::1"]
  secret_env: VISITOR_HASH_SECRET

audio:
  lufs: -16.0
  true_peak_db: -1.0
  lra: 7.0
  edge_pad_ms: 150
  tts_join_gap_ms: 250   # pause inserted between trimmed Kokoro chunks
  delivery: flac
  silence_db: -50
  max_words_per_s: 3.6   # speech-rate QC ceiling (truncation smell)
  min_words_per_s: 1.2   # speech-rate QC floor

logging:
  level: INFO
  dir: logs              # relative to pilgrim/
  file: station.log
  max_bytes: 10485760    # 10 MB
  backups: 5

library:
  soft_cap_gb: 100
  dir: library
  web_dir: web
  db: station.db
  bible_dir: bible
  prompts_dir: prompts

talk:
  time_mention_ttl_s: 900   # DJ clips that mention the time expire after this
  field_reporter_name: Giles  # PLACEHOLDER until the user names him (SFX.md §10.1)

# Sound effects overlaid on non-news talk (SFX.md). Never on news, by construction.
sfx:
  enabled: true
  model: stable-audio-3-small-sfx
  steps: 8
  cfg_scale: 4.0
  timeout_s: 60
  stinger_gain: 0.5        # TBD by ear (SFX.md §10.3); applied at air time
  bed_gain: 0.15
  host_duck: 0.7           # host gain while a stinger plays (anti-clip)
  bed_cue: wind_bed        # ambience under every field report
  bed_max_s: 30
  joke_cue: rimshot        # 50/50 coin after a marked joke
  joke_p: 0.5
  max_per_window: 3        # at most 3 stingers ...
  window_s: 10             # ... in any 10 s of air
  max_stinger_s: 2.5
  # Prompt lottery is real: only ear-approved cues render or air (SFX.md §6).
  # evergreen: rendered once into a recycled stock pool (fixed seed).
  # otherwise contextual: rendered fresh for the clip that calls for it.
  cues:
    chicken: {prompt: "excited chicken clucking, barnyard commotion", duration_s: 2.0}
    cow: {prompt: "a single slow cartoon cow moo, barnyard", duration_s: 2.0}
    horse: {prompt: "cartoon horse neigh and snort", duration_s: 2.0}
    pig: {prompt: "happy pig oinking oink oink, comic barnyard", duration_s: 2.0}
    slide_whistle: {prompt: "comical slide whistle going up then down", duration_s: 2.0,
                    seed: 24, evergreen: true}
    # not yet approved by ear: re-roll and flip `approved` once one lands
    rooster: {prompt: "rooster crowing cock-a-doodle-doo, morning farm", duration_s: 2.5,
              approved: false}
    sprinkler: {prompt: "garden sprinkler spraying water psst psst, irrigation",
                duration_s: 2.0, approved: false}
    wind_bed: {prompt: "gentle wind over an open grass field, soft outdoor ambience",
               duration_s: 10.0, approved: false}
    rimshot: {prompt: "snare drum rimshot ba dum tss, comedy beat", duration_s: 1.5,
              seed: 22, evergreen: true, approved: false}
    airhorn: {prompt: "loud airhorn blast, comedic party horn", duration_s: 1.5,
              seed: 21, evergreen: true, approved: false}
    record_scratch: {prompt: "turntable record scratch, DJ sound effect", duration_s: 1.5,
                     seed: 23, evergreen: true, approved: false}
    sad_trombone: {prompt: "sad trombone wah wah wah wah, comedic failure", duration_s: 2.5,
                   seed: 25, evergreen: true, approved: false}
    boing: {prompt: "cartoon spring boing, wonky bounce", duration_s: 1.5, seed: 26,
            evergreen: true, approved: false}
    applause: {prompt: "small tinny crowd applause burst", duration_s: 2.0, seed: 27,
               evergreen: true, approved: false}

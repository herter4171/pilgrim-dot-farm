# TEST ONLY (SPLIT_PLAN §6.1.4): expose the e2e server's test endpoints through
# the gateway so `make e2e-split` can read the airplay report and splice state.
# Production renders gateway/extra-none.conf (empty) instead.
location ^~ /api/test/ {
    proxy_pass http://pilgrim_origin;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_x_real_ip;
    proxy_set_header X-Forwarded-For $http_x_real_ip;
    proxy_cache off;
    error_page 502 504 = @offair;
}

# TEST ONLY (ALBUM_ART.md Step 8): the split fixture origin serves seeded cover
# art at /api/art/<id> so `make e2e-split` exercises the client's art_url path
# through the edge. Production has no art route (covers are CloudFront-only),
# so extra-none.conf stays empty.
location ~ ^/api/art/[0-9]+$ {
    proxy_pass http://pilgrim_origin;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_x_real_ip;
    proxy_set_header X-Forwarded-For $http_x_real_ip;
    proxy_cache off;
    error_page 502 504 = @offair;
}

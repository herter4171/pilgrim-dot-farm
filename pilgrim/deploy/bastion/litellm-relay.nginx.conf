# Pilgrim Dot Farm — bastion LiteLLM relay (SCALABILITY.md Step 5 addendum).
#
# LiteLLM (litellm.twr.church) is a LAN service behind a public name + cert.
# Fargate tasks cannot reach it, so the bastion (in the VPC, on the tailnet)
# relays: task -> bastion:4000 -> https://<mac tailnet name> (tailscale serve
# on the M5) -> https://litellm.twr.church. The web tier's hosts.litellm points
# here (pilgrim/deploy/container/overlay.yaml). Plain HTTP inside the VPC; the
# hop to the Mac is TLS with the tailnet certificate verified (depth 2: the
# Let's Encrypt chain, docs/backends.md §8).
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 256; }
http {
    access_log /dev/stdout;
    # MagicDNS for the tailnet name; the bastion's tailscaled answers here.
    resolver 100.100.100.100 valid=60s ipv6=off;
    server {
        listen 4000;
        server_name _;
        client_max_body_size 4m;
        location / {
            set $mac https://@@MAC_TAILNET_NAME@@;
            proxy_pass $mac;
            proxy_http_version 1.1;
            # tailscale serve forwards Host unchanged, and LiteLLM's own nginx
            # answers 421 for any name but its own: SNI is the tailnet name
            # (certificate), Host is the backend's (seen 2026-11-05).
            proxy_set_header Host litellm.twr.church;
            proxy_set_header Connection "";
            proxy_ssl_server_name on;
            proxy_ssl_name @@MAC_TAILNET_NAME@@;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 2;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            # LLM calls run long and may stream (SSE): no buffering, long reads.
            proxy_buffering off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 300s;
            proxy_send_timeout 60s;
        }
        location = /relay-health { return 200 "ok\n"; }
    }
}
